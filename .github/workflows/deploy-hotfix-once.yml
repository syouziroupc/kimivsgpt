name: deploy-hotfix-once

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-hotfix]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate Worker bundle and contracts
        run: |
          npm run type-check
          npm run test:concurrency
          npm run test:reliability
          node --experimental-strip-types scripts/verify-model-policy.mjs
          node --experimental-strip-types scripts/verify-panel-runner.mjs
          npm run build-check
      - name: Deploy directly when Cloudflare token is configured
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            npm run deploy
          else
            echo 'Cloudflare deployment credentials are not configured in GitHub Actions; relying on the repository Cloudflare integration and verifying production below.'
          fi
      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..18}; do
            body="$(curl --fail --silent --show-error --max-time 15 https://kimivsgpt.syouziroupc.workers.dev/health || true)"
            echo "$body"
            if printf '%s' "$body" | grep -q '"version":"0.12.0-artifact-audit"' \
              && printf '%s' "$body" | grep -q '"visual_audit":{"enabled":true' \
              && printf '%s' "$body" | grep -q '"application_quota":"none"' \
              && printf '%s' "$body" | grep -q '"review_rate_limit":"none"' \
              && printf '%s' "$body" | grep -q '"rpc_error_fallback":true'; then
              exit 0
            fi
            sleep 5
          done
          echo 'Production health did not reach expected reliable version.' >&2
          exit 1

      - name: Acquire short-lived OIDC token for synthetic visual proof
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kimivsgpt-hotfix-smoke")"
          token="$(printf '%s' "$token_json" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          test -n "$token"
          echo "::add-mask::$token"
          echo "SMOKE_OIDC_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Real visual model smoke test
        run: |
          python -m pip install Pillow
          python scripts/live-visual-smoke.py
