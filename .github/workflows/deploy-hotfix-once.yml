name: deploy-hotfix-once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-hotfix]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate Worker bundle
        run: npm run build-check
      - name: Deploy production Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            body="$(curl --fail --silent --show-error --max-time 15 https://kimivsgpt.syouziroupc.workers.dev/health || true)"
            echo "$body"
            if printf '%s' "$body" | grep -q '"version":"0.7.0-resilient"' \
              && printf '%s' "$body" | grep -q '"application_quota":"none"'; then
              exit 0
            fi
            sleep 5
          done
          echo 'Production health did not reach expected hotfix version.' >&2
          exit 1
