name: patch-auditor-040-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[patch-auditor-040]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch Worker metadata and verification endpoint
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/index.ts')
          s = p.read_text()

          old = '  AUDITOR_ACCESS_KEY?: string;\n}'
          new = '  AUDITOR_ACCESS_KEY?: string;\n  OPENAI_APPS_CHALLENGE?: string;\n}'
          if old not in s:
              raise SystemExit('Env insertion anchor not found')
          s = s.replace(old, new, 1)

          if 'const VERSION = "0.3.2";' not in s:
              raise SystemExit('Version anchor not found')
          s = s.replace('const VERSION = "0.3.2";', 'const VERSION = "0.4.0";', 1)

          old_ann = 'annotations: { readOnlyHint: true, openWorldHint: false },'
          new_ann = 'annotations: { readOnlyHint: true, openWorldHint: false, destructiveHint: false },'
          if old_ann not in s:
              raise SystemExit('Annotation anchor not found')
          s = s.replace(old_ann, new_ann, 1)

          anchor = '    if (url.pathname === "/health") {'
          insertion = '''    if (url.pathname === "/.well-known/openai-apps-challenge") {\n      const token = env.OPENAI_APPS_CHALLENGE;\n      if (!token) return new Response("Not configured", { status: 404 });\n      return new Response(token, {\n        headers: { "Content-Type": "text/plain; charset=utf-8" },\n      });\n    }\n\n'''
          if anchor not in s:
              raise SystemExit('Route insertion anchor not found')
          s = s.replace(anchor, insertion + anchor, 1)

          p.write_text(s)
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name syouziroupc
          git config user.email syouziroupc@gmail.com
          git add src/index.ts
          git commit -m "Prepare Worker 0.4.0 for plugin submission"
          git push
