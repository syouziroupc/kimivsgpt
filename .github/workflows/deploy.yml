name: deploy-cloudflare
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run type-check
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set optional auditor access key
        run: |
          if [ -n "$AUDITOR_ACCESS_KEY" ]; then
            printf '%s' "$AUDITOR_ACCESS_KEY" | npx wrangler secret put AUDITOR_ACCESS_KEY
          else
            echo "AUDITOR_ACCESS_KEY is not configured; /mcp remains unauthenticated."
          fi
        env:
          AUDITOR_ACCESS_KEY: ${{ secrets.AUDITOR_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
