name: diagnose-reliability-once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[diagnose-reliability]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Capture diagnostics
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          mkdir -p diagnostics
          npm run type-check > diagnostics/typecheck.txt 2>&1
          echo $? > diagnostics/typecheck-exit.txt
          npm run build-check > diagnostics/build-check.txt 2>&1
          echo $? > diagnostics/build-check-exit.txt
          npm run deploy > diagnostics/deploy.txt 2>&1
          echo $? > diagnostics/deploy-exit.txt
          curl --silent --show-error --max-time 15 https://kimivsgpt.syouziroupc.workers.dev/health > diagnostics/health.txt 2>&1
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: reliability-diagnostics
          path: diagnostics/
          retention-days: 1
