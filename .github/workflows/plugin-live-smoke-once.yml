name: plugin-live-smoke-once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[plugin-live-smoke]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify health v0.4.0
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error https://kimivsgpt.syouziroupc.workers.dev/health)"
          echo "$body"
          printf '%s' "$body" | grep -q '"version":"0.4.0"'

      - name: Verify MCP tool metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"plugin-smoke","version":"1.0.0"}}}' \
            https://kimivsgpt.syouziroupc.workers.dev/mcp | tee /tmp/init.txt
          grep -q 'kimi-vs-gpt-auditor' /tmp/init.txt

          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2025-03-26' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            https://kimivsgpt.syouziroupc.workers.dev/mcp | tee /tmp/tools.txt
          grep -q 'review_strategy' /tmp/tools.txt
          grep -q '"readOnlyHint":true' /tmp/tools.txt
          grep -q '"openWorldHint":false' /tmp/tools.txt
          grep -q '"destructiveHint":false' /tmp/tools.txt

      - name: Call real standard review once
        shell: bash
        run: |
          set -euo pipefail
          payload='{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"review_strategy","arguments":{"user_request":"Choose whether to use a plugin with an external critic for complex tasks.","proposed_direction":"Use a Skill plus a compact remote MCP critic, while skipping trivial tasks.","key_claims":["The critic should only flag defects rather than solve the task."],"assumptions":["A concise second opinion can reduce anchoring without excessive cost."],"evidence":["The deployed MCP exposes review_strategy and enforces short inputs and outputs."],"constraints":["Minimize API usage and do not delegate coding or research."],"uncertainties":["Plugin invocation remains product-surface dependent."],"review_level":"standard"}}}'
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2025-03-26' \
            --data "$payload" \
            https://kimivsgpt.syouziroupc.workers.dev/mcp | tee /tmp/call.txt
          ! grep -q 'audit_failed' /tmp/call.txt
          grep -Eq 'verdict|proceed|revise|verify' /tmp/call.txt
