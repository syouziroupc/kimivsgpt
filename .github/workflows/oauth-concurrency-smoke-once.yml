name: oauth-concurrency-smoke-once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[oauth-concurrency-smoke]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Start local Worker
        shell: bash
        run: |
          set -euo pipefail
          nohup npx wrangler dev --local --port 8787 --var OWNER_AUTH_SECRET:test-owner-secret >/tmp/wrangler.log 2>&1 &
          echo $! >/tmp/wrangler.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wrangler.log
          exit 1

      - name: Verify five concurrent refreshes converge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor

          base = 'http://127.0.0.1:8787'
          redirect = 'http://127.0.0.1:54321/callback'
          resource = base + '/mcp'
          verifier = 'A' * 64
          challenge = base64.urlsafe_b64encode(hashlib.sha256(verifier.encode()).digest()).rstrip(b'=').decode()

          def request(url, data=None, headers=None, follow=True):
              req = urllib.request.Request(url, data=data, headers=headers or {})
              if follow:
                  return urllib.request.urlopen(req, timeout=20)
              opener = urllib.request.build_opener(urllib.request.HTTPHandler())
              return opener.open(req, timeout=20)

          reg_body = json.dumps({
              'client_name':'parallel-refresh-smoke',
              'redirect_uris':[redirect],
              'token_endpoint_auth_method':'none',
              'application_type':'native'
          }).encode()
          with request(base + '/oauth/register', reg_body, {'Content-Type':'application/json'}) as r:
              client = json.load(r)
          client_id = client['client_id']

          form = urllib.parse.urlencode({
              'client_id':client_id,
              'redirect_uri':redirect,
              'response_type':'code',
              'code_challenge':challenge,
              'code_challenge_method':'S256',
              'scope':'auditor:review',
              'resource':resource,
              'owner_secret':'test-owner-secret'
          }).encode()
          req = urllib.request.Request(base + '/oauth/authorize', data=form, headers={'Content-Type':'application/x-www-form-urlencoded'})
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          try:
              opener.open(req, timeout=20)
              raise RuntimeError('expected redirect')
          except urllib.error.HTTPError as e:
              if e.code != 302:
                  raise
              location = e.headers['Location']
          code = urllib.parse.parse_qs(urllib.parse.urlparse(location).query)['code'][0]

          token_form = urllib.parse.urlencode({
              'grant_type':'authorization_code',
              'client_id':client_id,
              'redirect_uri':redirect,
              'code':code,
              'code_verifier':verifier,
              'resource':resource
          }).encode()
          with request(base + '/oauth/token', token_form, {'Content-Type':'application/x-www-form-urlencoded'}) as r:
              tokens = json.load(r)
          old_refresh = tokens['refresh_token']

          def refresh(_):
              body = urllib.parse.urlencode({
                  'grant_type':'refresh_token',
                  'client_id':client_id,
                  'refresh_token':old_refresh,
                  'resource':resource
              }).encode()
              with request(base + '/oauth/token', body, {'Content-Type':'application/x-www-form-urlencoded'}) as r:
                  return r.status, json.load(r)

          with ThreadPoolExecutor(max_workers=5) as pool:
              results = list(pool.map(refresh, range(5)))
          assert all(status == 200 for status, _ in results), results
          pairs = [(body['access_token'], body['refresh_token']) for _, body in results]
          assert len(set(pairs)) == 1, 'parallel refreshes returned different token pairs'
          print('PARALLEL_REFRESH_5_OF_5_SUCCESS=true')
          print('PARALLEL_REFRESH_SAME_TOKEN_PAIR=true')
          PY

      - name: Stop local Worker
        if: always()
        run: |
          if [ -f /tmp/wrangler.pid ]; then kill "$(cat /tmp/wrangler.pid)" || true; fi
          tail -100 /tmp/wrangler.log || true
