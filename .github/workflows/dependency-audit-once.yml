name: dependency-audit-once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[dependency-audit]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json | tee /tmp/audit-prod.json
          exit 0
      - name: Audit all dependencies
        shell: bash
        run: |
          set +e
          npm audit --json | tee /tmp/audit-all.json
          exit 0
