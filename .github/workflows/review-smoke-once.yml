name: review-smoke-once

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[review-smoke]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Acquire short-lived GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kimivsgpt-hotfix-smoke")"
          token="$(printf '%s' "$token_json" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          test -n "$token"
          echo "SMOKE_OIDC_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Wait for updated production version
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..36}; do
            if curl -fsS --max-time 10 https://kimivsgpt.syouziroupc.workers.dev/health | grep -q '"version":"0.11.0-resilient-panel"'; then exit 0; fi
            sleep 5
          done
          exit 1
      - uses: actions/checkout@v4
      - name: Complex and concurrent live reviews
        run: python scripts/live-panel-smoke.py
