name: verify-hotfix-once

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[verify-hotfix]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify production health/version
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..36}; do
            body="$(curl --fail --silent --show-error --max-time 15 https://kimivsgpt.syouziroupc.workers.dev/health || true)"
            echo "$body"
            if printf '%s' "$body" | grep -q '"ok":true' \
              && printf '%s' "$body" | grep -q '"version":"0.7.0-resilient"' \
              && printf '%s' "$body" | grep -q '"application_quota":"none"' \
              && printf '%s' "$body" | grep -q '"response_guarantee":"schema-valid review_strategy result"'; then
              exit 0
            fi
            sleep 5
          done
          exit 1
