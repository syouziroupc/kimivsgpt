name: fix-kimi-deep-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[fix-kimi-deep]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch Kimi K2.6 deep path and parser diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('src/index.ts')
          s = p.read_text(encoding='utf-8')

          if 'const VERSION = "0.5.0";' not in s:
              raise SystemExit('unexpected VERSION target')
          s = s.replace('const VERSION = "0.5.0";', 'const VERSION = "0.5.1";', 1)

          old_prompt = 'Do not answer the user\'s task, write code/drafts, perform research, expand the task, or reveal/request chain-of-thought.\n'
          new_prompt = old_prompt + 'Do not emit analysis or thinking text; produce the final compact JSON immediately.\n'
          if old_prompt not in s:
              raise SystemExit('auditor prompt target not found')
          s = s.replace(old_prompt, new_prompt, 1)

          parser_pattern = re.compile(r'function parseAudit\(raw: unknown\): AuditResult \{.*?\n\}\n\nfunction errorText', re.S)
          parser_replacement = r'''function extractTextContent(content: unknown): string | null {
            if (typeof content === "string") return content;

            const direct = asRecord(content);
            if (direct) {
              const candidate = direct.text ?? direct.content;
              return typeof candidate === "string" ? candidate : null;
            }

            if (!Array.isArray(content)) return null;
            const parts = content.map((item) => {
              if (typeof item === "string") return item;
              const rec = asRecord(item);
              if (!rec) return "";
              const candidate = rec.text ?? rec.content;
              return typeof candidate === "string" ? candidate : "";
            }).filter(Boolean);
            return parts.length > 0 ? parts.join("\n") : null;
          }

          function parseAudit(raw: unknown): AuditResult {
            let value: unknown = raw;

            const rawRoot = asRecord(raw);
            if (rawRoot) {
              const response = rawRoot.response;
              if ((typeof response === "string" && response.trim().length > 0) || asRecord(response)) {
                value = response;
              }
            }

            let choiceRoot = asRecord(value);
            if ((!choiceRoot || !Array.isArray(choiceRoot.choices)) && rawRoot && Array.isArray(rawRoot.choices)) {
              choiceRoot = rawRoot;
            }

            if (choiceRoot && Array.isArray(choiceRoot.choices)) {
              const first = asRecord(choiceRoot.choices[0]);
              const message = asRecord(first?.message);
              if (message) {
                const directContent = asRecord(message.content);
                if (directContent) {
                  value = directContent;
                } else {
                  const content = extractTextContent(message.content);
                  if (content && content.trim().length > 0) {
                    value = content;
                  } else {
                    const reasoningPresent = [message.reasoning, message.reasoning_content]
                      .some((candidate) => typeof candidate === "string" && candidate.trim().length > 0);
                    const finishReason = shortText(first?.finish_reason, 40).replace(/[^a-zA-Z0-9_.-]/g, "_");
                    throw new Error(
                      `auditor_empty_content${reasoningPresent ? ":reasoning_only" : ""}${finishReason ? `:finish_${finishReason}` : ""}`,
                    );
                  }
                }
              }
            }

            const maybeError = asRecord(value);
            if (maybeError && !("verdict" in maybeError) && ("error" in maybeError || "errors" in maybeError)) {
              throw new Error("auditor_model_error_response");
            }

            if (typeof value === "string") {
              const trimmed = value.trim().replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");
              const start = trimmed.indexOf("{");
              const end = trimmed.lastIndexOf("}");
              if (start < 0 || end <= start) throw new Error("auditor_returned_no_json");
              try {
                value = JSON.parse(trimmed.slice(start, end + 1));
              } catch {
                throw new Error("auditor_invalid_json");
              }
            }

            return normalizeAudit(value);
          }

          function errorText'''
          s, n = parser_pattern.subn(parser_replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'parseAudit replacement count={n}')

          invoke_pattern = re.compile(r'async function invokeModel\(env: Env, model: string, serialized: string\): Promise<AuditResult> \{.*?\n\}\n\nasync function runReview', re.S)
          invoke_replacement = r'''function isKimi26Model(model: string): boolean {
            return model.includes("moonshotai/kimi-k2.6");
          }

          async function invokeModel(env: Env, model: string, serialized: string): Promise<AuditResult> {
            const kimi26 = isKimi26Model(model);
            const input: Record<string, unknown> = {
              messages: [
                { role: "system", content: AUDITOR_PROMPT },
                { role: "user", content: serialized },
              ],
              max_completion_tokens: kimi26 ? 512 : 360,
              temperature: 0,
              stream: false,
            };

            if (kimi26) {
              // Kimi K2.6 uses chat_template_kwargs.thinking. Disable hidden reasoning so the
              // small audit budget is spent on the final JSON instead of reasoning-only output.
              input.reasoning_effort = null;
              input.chat_template_kwargs = { thinking: false };
            } else {
              input.reasoning_effort = "low";
            }

            return parseAudit(await env.AI.run(model, input));
          }

          async function runReview'''
          s, n = invoke_pattern.subn(invoke_replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'invokeModel replacement count={n}')

          p.write_text(s, encoding='utf-8')

          package = Path('package.json')
          data = json.loads(package.read_text(encoding='utf-8'))
          data['version'] = '0.5.1'
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git diff --check
          grep -q 'chat_template_kwargs = { thinking: false }' src/index.ts
          grep -q 'auditor_empty_content' src/index.ts
          grep -q 'const VERSION = "0.5.1";' src/index.ts

      - name: Validate build and security
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run audit
          npm run type-check
          npm run build-check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'syouziroupc'
          git config user.email 'syouziroupc@gmail.com'
          git add src/index.ts package.json package-lock.json
          git commit -m 'Fix Kimi K2.6 reasoning-only audit failures'
          git push origin HEAD:main
