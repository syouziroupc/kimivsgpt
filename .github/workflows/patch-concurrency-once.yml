name: patch-concurrency-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[concurrency-repair]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply concurrency patch
        run: python3 scripts/patch-concurrency-once.py

      - name: Validate repaired tree
        run: |
          set -euo pipefail
          npm install
          npm run audit
          npm run type-check
          npm run test:concurrency
          npm run build-check

      - name: Commit repaired tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/auth.ts src/index.ts package.json package-lock.json scripts/verify-concurrency-contract.mjs .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'fix: make auditor OAuth and batch handling concurrency-safe'
          git push origin main
