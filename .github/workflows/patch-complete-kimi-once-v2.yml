name: Complete Kimi hardening patch once v2

on:
  push:
    branches:
      - fix/kimi-complete-20260909
    paths:
      - .github/workflows/patch-complete-kimi-once-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kimi-complete-20260909
      - name: Apply hardening patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/index.ts')
          s = p.read_text()
          s, n = re.subn(r'const VERSION = "0\.5\.3";', 'const VERSION = "0.5.4";', s, count=1)
          assert n == 1, 'version marker not found'

          old = '''function parseToolAudit(raw: unknown): AuditResult {
            const root = asRecord(raw);
            let calls: unknown[] | null = root && Array.isArray(root.tool_calls) ? root.tool_calls : null;

            if ((!calls || calls.length === 0) && root && Array.isArray(root.choices)) {
              const first = asRecord(root.choices[0]);
              const message = asRecord(first?.message);
              if (message && Array.isArray(message.tool_calls)) calls = message.tool_calls;
            }

            if (!calls || calls.length === 0) throw new Error("auditor_missing_tool_call");

            for (const item of calls) {
              const call = asRecord(item);
              if (!call) continue;
              const fn = asRecord(call.function);
              const name = shortText(call.name ?? fn?.name, 64);
              if (name !== "submit_audit") continue;

              let args: unknown = call.arguments ?? fn?.arguments;
              if (typeof args === "string") {
                try {
                  args = JSON.parse(args);
                } catch {
                  throw new Error("auditor_invalid_tool_arguments");
                }
              }
              return normalizeAudit(args);
            }

            throw new Error("auditor_missing_submit_audit_call");
          }
          '''
          new = '''function parseToolAudit(raw: unknown): AuditResult {
            const rawRoot = asRecord(raw);
            const responseRoot = rawRoot ? asRecord(rawRoot.response) : null;
            const root = responseRoot ?? rawRoot;
            let calls: unknown[] | null = root && Array.isArray(root.tool_calls) ? root.tool_calls : null;

            if ((!calls || calls.length === 0) && root && Array.isArray(root.choices)) {
              const first = asRecord(root.choices[0]);
              const message = asRecord(first?.message);
              if (message && Array.isArray(message.tool_calls)) calls = message.tool_calls;
            }

            if (!calls || calls.length === 0) throw new Error("auditor_missing_tool_call");

            for (const item of calls) {
              const call = asRecord(item);
              if (!call) continue;
              const fn = asRecord(call.function);
              const name = shortText(call.name ?? fn?.name, 64);
              if (name !== "submit_audit") continue;

              let args: unknown = call.arguments ?? fn?.arguments;
              if (typeof args === "string") {
                try {
                  args = JSON.parse(args);
                } catch {
                  throw new Error("auditor_invalid_tool_arguments");
                }
              }
              return normalizeAudit(args);
            }

            throw new Error("auditor_missing_submit_audit_call");
          }

          function parseKimiAudit(raw: unknown): AuditResult {
            try {
              return parseToolAudit(raw);
            } catch (toolError) {
              try {
                return parseAudit(raw);
              } catch (textError) {
                throw new Error(`auditor_kimi_output_unreadable:${errorText(toolError)}:${errorText(textError)}`);
              }
            }
          }
          '''
          assert old in s, 'parseToolAudit marker not found'
          s = s.replace(old, new, 1)

          old = '''async function consumeDailyBudget(env: Env, level: "standard" | "deep"): Promise<void> {
            const standardLimit = parsePositiveInt(env.AUDITOR_DAILY_STANDARD_LIMIT, DEFAULT_DAILY_STANDARD_LIMIT, 10000);
            const deepLimit = parsePositiveInt(env.AUDITOR_DAILY_DEEP_LIMIT, DEFAULT_DAILY_DEEP_LIMIT, 5);
            const limit = level === "deep" ? deepLimit : standardLimit;
            const result = await getAuthState(env).consumeUsage(level, limit);
            if (!result.allowed) {
              throw new Error(`daily_limit_exceeded:${level}:${result.used}/${result.limit}`);
            }
          }
          '''
          new = '''function dailyLimit(env: Env, level: "standard" | "deep"): number {
            return level === "deep"
              ? parsePositiveInt(env.AUDITOR_DAILY_DEEP_LIMIT, DEFAULT_DAILY_DEEP_LIMIT, 5)
              : parsePositiveInt(env.AUDITOR_DAILY_STANDARD_LIMIT, DEFAULT_DAILY_STANDARD_LIMIT, 10000);
          }

          async function checkDailyBudget(env: Env, level: "standard" | "deep"): Promise<void> {
            const result = await getAuthState(env).checkUsage(level, dailyLimit(env, level));
            if (!result.allowed) {
              throw new Error(`daily_limit_exceeded:${level}:${result.used}/${result.limit}`);
            }
          }

          async function consumeDailyBudget(env: Env, level: "standard" | "deep"): Promise<void> {
            const result = await getAuthState(env).consumeUsage(level, dailyLimit(env, level));
            if (!result.allowed) {
              throw new Error(`daily_limit_exceeded:${level}:${result.used}/${result.limit}`);
            }
          }
          '''
          assert old in s, 'budget function marker not found'
          s = s.replace(old, new, 1)

          old = '''async function invokeModel(env: Env, model: string, serialized: string): Promise<AuditResult> {
            const kimi26 = isKimi26Model(model);
            const input: Record<string, unknown> = {
              messages: [
                { role: "system", content: AUDITOR_PROMPT },
                { role: "user", content: serialized },
              ],
              max_completion_tokens: kimi26 ? 512 : 360,
              temperature: 0,
              stream: false,
            };

            if (kimi26) {
              // Kimi K2.6 is a function-calling model. Workers AI JSON Mode does not list Kimi
              // among its supported models, so force one schema-shaped tool call instead.
              input.chat_template_kwargs = { thinking: false };
              input.tools = [{
                name: "submit_audit",
                description: "Return the compact audit result. Call exactly once and do not answer in prose.",
                parameters: AUDIT_JSON_SCHEMA,
              }];
              input.tool_choice = "required";
              input.parallel_tool_calls = false;
              return parseToolAudit(await env.AI.run(model, input));
            }

            input.reasoning_effort = "low";
            return parseAudit(await env.AI.run(model, input));
          }
          '''
          new = '''async function invokeModel(env: Env, model: string, serialized: string): Promise<AuditResult> {
            const kimi26 = isKimi26Model(model);
            const systemPrompt = kimi26
              ? `${AUDITOR_PROMPT}\nFor this request, do not print the audit JSON in message content. Call submit_audit exactly once with the complete audit object as its arguments.`
              : AUDITOR_PROMPT;
            const input: Record<string, unknown> = {
              messages: [
                { role: "system", content: systemPrompt },
                { role: "user", content: serialized },
              ],
              max_completion_tokens: kimi26 ? 512 : 360,
              temperature: 0,
              stream: false,
            };

            if (kimi26) {
              input.chat_template_kwargs = { thinking: false };
              input.tools = [{
                name: "submit_audit",
                description: "Return the compact audit result. Call exactly once and do not answer in prose.",
                parameters: AUDIT_JSON_SCHEMA,
              }];
              input.tool_choice = "required";
              input.parallel_tool_calls = false;
              return parseKimiAudit(await env.AI.run(model, input));
            }

            input.reasoning_effort = "low";
            return parseAudit(await env.AI.run(model, input));
          }
          '''
          assert old in s, 'invokeModel marker not found'
          s = s.replace(old, new, 1)

          old = '''  // Reserve exactly one daily budget unit before the model call. No automatic model retry/fallback.
            await consumeDailyBudget(env, packet.review_level);
            return invokeModel(env, selected, serialized);
          }
          '''
          # Normalize accidental indentation in the Python literal itself, then use regex against source.
          pattern = re.compile(r'  // Reserve exactly one daily budget unit before the model call\. No automatic model retry/fallback\.\n  await consumeDailyBudget\(env, packet\.review_level\);\n  return invokeModel\(env, selected, serialized\);\n}', re.M)
          replacement = '''  // Check quota before inference, but count only a successfully parsed audit.
            await checkDailyBudget(env, packet.review_level);
            const audit = await invokeModel(env, selected, serialized);
            await consumeDailyBudget(env, packet.review_level);
            return audit;
          }'''.replace('            ', '  ')
          s, n = pattern.subn(replacement, s, count=1)
          assert n == 1, 'runReview budget marker not found'

          old = '''function oauthUnauthorized(origin: string): Response {
            const metadata = `${origin}/.well-known/oauth-protected-resource`;
            return new Response("Unauthorized", {
              status: 401,
              headers: {
                "WWW-Authenticate": `Bearer resource_metadata="${metadata}", scope="${OAUTH_SCOPE}"`,
                "Cache-Control": "no-store",
              },
            });
          }
          '''
          new = '''function oauthUnauthorized(origin: string): Response {
            const metadata = `${origin}/.well-known/oauth-protected-resource`;
            return new Response("Unauthorized", {
              status: 401,
              headers: {
                "WWW-Authenticate": `Bearer resource_metadata="${metadata}", scope="${OAUTH_SCOPE}"`,
                "Access-Control-Allow-Origin": "*",
                "Access-Control-Expose-Headers": "WWW-Authenticate",
                "Cache-Control": "no-store",
              },
            });
          }
          '''
          assert old in s, 'oauthUnauthorized marker not found'
          s = s.replace(old, new, 1)

          s = s.replace(
              '"Access-Control-Allow-Headers": "Authorization, Content-Type, MCP-Protocol-Version",',
              '"Access-Control-Allow-Headers": "Authorization, Content-Type, MCP-Protocol-Version, Mcp-Method, Mcp-Name",',
              1,
          )

          old = '''        oauth: { enabled: true, owner_secret_configured: Boolean(env.OWNER_AUTH_SECRET), pkce: "S256" },
                rate_limits: { standard_per_minute: 30, deep_per_minute: 3, auth_attempts_per_minute_per_ip: 10 },
          '''
          # Add health metadata using direct smaller replacement to avoid indentation sensitivity.
          target = '      oauth: { enabled: true, owner_secret_configured: Boolean(env.OWNER_AUTH_SECRET), pkce: "S256" },\n      rate_limits:'
          repl = '      oauth: { enabled: true, owner_secret_configured: Boolean(env.OWNER_AUTH_SECRET), pkce: "S256" },\n      mcp_protocol: "2026-07-28+legacy-stateless",\n      deep_output: "required_function_call_with_json_fallback",\n      rate_limits:'
          assert target in s, 'health marker not found'
          s = s.replace(target, repl, 1)
          p.write_text(s)

          p = Path('src/auth.ts')
          s = p.read_text()
          marker = '  async consumeUsage(level: "standard" | "deep", limit: number): Promise<{ allowed: boolean; used: number; limit: number; day: string }> {'
          helper = '''  async checkUsage(level: "standard" | "deep", limit: number): Promise<{ allowed: boolean; used: number; limit: number; day: string }> {
            const day = new Date().toISOString().slice(0, 10);
            const key = `usage:${day}:${level}`;
            const current = Number((await this.ctx.storage.get(key)) ?? 0);
            return { allowed: current < limit, used: current, limit, day };
          }

          '''.replace('          ', '') + marker
          assert marker in s, 'auth marker not found'
          s = s.replace(marker, helper, 1)
          p.write_text(s)

          p = Path('package.json')
          s = p.read_text()
          s, n = re.subn(r'"version": "0\.5\.2"', '"version": "0.5.4"', s, count=1)
          assert n == 1
          p.write_text(s)

          p = Path('package-lock.json')
          s = p.read_text()
          s, n = re.subn(r'"version": "0\.5\.2"', '"version": "0.5.4"', s, count=2)
          assert n == 2
          p.write_text(s)
          PY
          git diff --check
          grep -q 'const VERSION = "0.5.4"' src/index.ts
          grep -q 'return parseKimiAudit' src/index.ts
          grep -q 'checkDailyBudget' src/index.ts
          grep -q 'deep_output: "required_function_call_with_json_fallback"' src/index.ts
      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run audit
          npm run type-check
          npm run build-check
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.ts src/auth.ts package.json package-lock.json
          git diff --cached --check
          git commit -m 'Harden Kimi output parsing and quota accounting'
          git push origin HEAD:fix/kimi-complete-20260909
